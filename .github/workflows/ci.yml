name: CI Pipeline

on:
  push:
    branches:
      - Production
      - Testing
      - main
      - master
  pull_request:
    branches:
      - Production
      - Testing
      - main
      - master
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint, Test & Build Verification
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8 pyinstaller

      - name: Check Python Syntax (py_compile)
        run: |
          python -m py_compile PDFCommand/*.py

      - name: Lint with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 PDFCommand/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Test Suite (pytest)
        run: |
          pytest tests/ -v

      - name: Verify PyInstaller Executable Build
        run: |
          cd PDFCommand
          pyinstaller PDFCommander.spec --noconfirm --clean
          if (!(Test-Path "dist/PDFCommander.exe")) {
            Write-Error "PDFCommander.exe was not created in dist directory!"
            exit 1
          }
          Write-Host "Build verification passed: dist/PDFCommander.exe successfully built."

