name: CD Release Pipeline

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag Name (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Executable, Installer & Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Executable (PyInstaller)
        run: |
          cd PDFCommand
          pyinstaller PDFCommander.spec --noconfirm --clean
          if (!(Test-Path "dist/PDFCommander.exe")) {
            Write-Error "PDFCommander.exe was not created in dist directory!"
            exit 1
          }
          Write-Host "Successfully generated dist/PDFCommander.exe"

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Compile Windows Installer (Inno Setup)
        run: |
          cd PDFCommand
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" SetupFileSettings.iss
          if (!(Test-Path "Output/PDFCommand-Setup.exe")) {
            Write-Error "PDFCommand-Setup.exe was not created in Output directory!"
            exit 1
          }
          Write-Host "Successfully generated Output/PDFCommand-Setup.exe"

      - name: Upload Build Artifacts (Actions Dashboard)
        uses: actions/upload-artifact@v4
        with:
          name: PDFCommander-Windows-Builds
          path: |
            PDFCommand/dist/PDFCommander.exe
            PDFCommand/Output/PDFCommand-Setup.exe
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name != '' && startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name }}
          name: PDF Commander ${{ github.ref_name != '' && startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name }}
          files: |
            PDFCommand/dist/PDFCommander.exe
            PDFCommand/Output/PDFCommand-Setup.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

